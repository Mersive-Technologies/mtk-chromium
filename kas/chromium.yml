header:
  version: 17
  includes:
    - repo: meta-mersive-oss
      file: kas/deps.yml

machine: genio-1200-evk
distro: rity-demo
target: chromium-ozone-wayland

repos:
  meta-mersive-oss:
    url: git@github.com:Mersive-Technologies/yocto-phoenix-oss.git
    branch: scarthgap

  meta-browser:
    url: https://gitlab.collabora.com/mediatek/aiot/rity/meta-browser.git
    path: meta-browser
    commit: 7dc042b680d22b742f788294fa36be57170e115f
    branch: mediatek/scarthgap
    layers:
      meta-chromium:

local_conf_header:
  unmask-chromium-wayland: |
    BBMASK:remove = ".*recipes-browser/chromium/chromium-ozone-wayland.*"

  package-class: PACKAGE_CLASSES ?= "package_deb"
