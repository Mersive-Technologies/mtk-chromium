header:
  version: 17
  includes:
    - repo: meta-mersive-oss
      file: kas/deps.yml

machine: genio-1200-evk
distro: rity-demo
target: chromium-ozone-wayland

repos:
  meta-mersive-oss:
    url: git@github.com:Mersive-Technologies/yocto-phoenix-oss.git
    branch: scarthgap

  meta-browser:
    url: https://gitlab.collabora.com/mediatek/aiot/rity/meta-browser.git
    path: meta-browser
    commit: f50e7319de63d6c36810cfbfac417e18233d430e
    branch: update/mediatek/scarthgap/138.0.7204.298/a6845a99
    layers:
      meta-chromium:

  meta-mersive-phoenix:
    path: meta-mersive-phoenix

local_conf_header:
  unmask-chromium-wayland: |
    BBMASK:remove = ".*recipes-browser/chromium/chromium-ozone-wayland.*"

  clean_build: |
    DL_DIR ?= "${TOPDIR}/../yocto_downloads"
    BB_GENERATE_MIRROR_TARBALLS = "1"
    PERSISTENT_DIR ?= "${TOPDIR}/../cache-pod"
    SSTATE_DIR ?= "${TOPDIR}/../sstate-cache-pod"

  package-class: PACKAGE_CLASSES ?= "package_deb"
